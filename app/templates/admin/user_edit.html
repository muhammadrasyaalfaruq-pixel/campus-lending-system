{% extends "base.html" %}
{% block title %}Edit Pengguna - PinjamKampus{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
    <a href="/admin/users" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
    <div>
        <h1 class="mb-0" style="font-size:1.75rem;">Edit Pengguna</h1>
        <p class="text-secondary mb-0 small">{{ user.email }}</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card-modern p-4">
            <form method="post" action="/admin/users/{{ user.id }}/update">
                <div class="mb-3">
                    <label class="form-label fw-medium">Nama Lengkap</label>
                    <input class="form-control" name="name" value="{{ user.name }}" maxlength="100" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Email</label>
                    <input class="form-control" type="email" name="email" value="{{ user.email }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">NIM / Student ID</label>
                    <input class="form-control" name="student_id" value="{{ user.student_id or '' }}" maxlength="50">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Nomor HP</label>
                    <input class="form-control" name="phone" value="{{ user.phone or '' }}" maxlength="20">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Peran</label>
                    <select class="form-select" name="role_id" required>
                        {% for role in roles %}
                        <option value="{{ role.id }}" {% if role.id == user.role_id %}selected{% endif %}>{{ role.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium">Password Baru <span class="text-secondary fw-normal">(kosongkan jika tidak diubah)</span></label>
                    <input class="form-control" type="password" name="new_password" minlength="6">
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary-modern flex-fill" type="submit">
                        <i class="bi bi-check-lg me-1"></i>Simpan Perubahan
                    </button>
                    <a href="/admin/users" class="btn btn-outline-secondary flex-fill">Batal</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
