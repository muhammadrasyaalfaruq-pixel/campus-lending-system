{% extends "base.html" %}
{% block title %}Ajukan Peminjaman - PinjamKampus{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h1 class="h3 mb-3">Ajukan Peminjaman Alat</h1>
        <form method="post" action="/loans/request">
            <div class="mb-3">
                <label class="form-label">Tujuan Peminjaman</label>
                <textarea class="form-control" name="purpose" rows="2" required placeholder="Contoh: Kegiatan praktikum mata kuliah Multimedia"></textarea>
            </div>
            <h2 class="h5 mb-3">Pilih Alat</h2>
            <div class="table-responsive mb-4">
                <table class="table align-middle">
                    <thead><tr><th>Pilih</th><th>Alat</th><th>Tersedia</th><th>Jumlah Pinjam</th></tr></thead>
                    <tbody>
                        {% for item in items %}
                        <tr>
                            <td><input class="form-check-input" type="checkbox" name="item_ids" value="{{ item.id }}"></td>
                            <td>{{ item.name }} ({{ item.code }})</td>
                            <td>{{ item.available_stock }}</td>
                            <td><input class="form-control form-control-sm" type="number" name="quantities" value="1" min="1" max="{{ item.available_stock }}" style="width: 80px;"></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <button class="btn btn-primary" type="submit"><i class="bi bi-send me-1"></i>Kirim Pengajuan</button>
        </form>
    </div>
</div>
{% endblock %}
