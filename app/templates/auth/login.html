{% extends "base.html" %}

{% block title %}Masuk - PinjamKampus{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-lg-6 col-xl-5">
        <div class="p-5 card-modern">
            <div class="text-center mb-5">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary rounded-3 p-3 mb-4" style="width: 64px; height: 64px;">
                    <i class="bi bi-box-seam text-white fs-3"></i>
                </div>
                <h1 class="mb-2" style="font-size: 1.75rem;">Masuk ke Akun</h1>
                <p class="text-secondary mb-0">Akses sistem peminjaman alat kampus dengan akunmu.</p>
            </div>

            {% if msg %}
            <div class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2 mb-4" role="alert">
                <i class="bi bi-check-circle-fill fs-5"></i>
                <div>{{ msg }}</div>
                <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
            </div>
            {% endif %}

            {% if error %}
            <div class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                <div>{{ error }}</div>
                <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
            </div>
            {% endif %}

            <form method="post" action="/auth/login" class="needs-validation" novalidate>
                <div class="mb-4">
                    <label class="form-label fw-semibold mb-2">Alamat Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-envelope text-secondary"></i>
                        </span>
                        <input type="email" name="email" class="form-control ps-0" placeholder="nama@kampus.ac.id" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold mb-2">Kata Sandi</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock text-secondary"></i>
                        </span>
                        <input type="password" name="password" class="form-control ps-0" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary-modern d-flex align-items-center justify-content-center gap-2 py-2">
                        <i class="bi bi-box-arrow-in-right fs-5"></i>
                        <span>Masuk</span>
                    </button>
                </div>
            </form>

            <hr class="my-4">

            <div class="text-center">
                <p class="text-secondary mb-0">Belum punya akun?
                    <a href="/auth/register" class="text-decoration-none fw-semibold text-primary">Daftar sekarang</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
