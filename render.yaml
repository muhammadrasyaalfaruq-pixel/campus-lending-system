services:
  - type: web
    name: pinjamkampus
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FINE_RATE_PER_DAY
        value: 5000
      - key: MAX_ACTIVE_LOANS_PER_USER
        value: 3
      - key: UPLOAD_DIR
        value: ./app/static/uploads
      - key: MAX_UPLOAD_SIZE
        value: 5242880
      - key: ALLOWED_EXTENSIONS
        value: jpg,jpeg,png,gif
